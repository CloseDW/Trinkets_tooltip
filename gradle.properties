# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=0.7.0+1.20.1
group=closedw.tt

# Dependencies
fabric_api_version=0.92.12+1.20.1
trinkets_version=3.7.2
# Optional dependencies
# Configured is the config screen framework. It is not on any public maven for 1.20.1, so the
# jar is vendored in libs/ and consumed with `modCompileOnly files(...)`.
configured_version=2.2.3
# JEI is optional. Compiled against the newest release present in the offline Gradle cache;
# the API used here exists from 15.17.0 onwards.
jei_version=15.20.0.132
